<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ingresar — SGCV</title>
</head>
<body>
  <h1>Ingresar</h1>

  {% if form.errors %}
    <p style="color: red;">Usuario o contraseña incorrectos.</p>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Ingresar</button>
  </form>
</body>
</html>
