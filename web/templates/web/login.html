{% extends "base.html" %}

{% block title %}Ingresar — Huellitas{% endblock %}

{% block content %}
<h1>Ingresar</h1>
<div class="card" style="max-width: 400px;">
  {% if form.errors %}
    <p class="error">Usuario o contraseña incorrectos.</p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primario">Ingresar</button>
  </form>
</div>
{% endblock %}
