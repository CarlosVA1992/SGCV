<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Nueva cita — Huellitas</title>
</head>
<body>
  <h1>Registrar cita</h1>

  {% if messages %}
    {% for message in messages %}
      <p style="color: green;">{{ message }}</p>
    {% endfor %}
  {% endif %}

  <form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}
      <p>
        {{ field.label_tag }}<br>
        {{ field }}
        {% if field.errors %}
          <br><span style="color: red;">{{ field.errors|striptags }}</span>
        {% endif %}
      </p>
    {% endfor %}
    <button type="submit">Guardar cita</button>
  </form>
</body>
</html>
